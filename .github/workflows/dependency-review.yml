name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # Flags known vulnerabilities and disallowed licences in newly added dependencies.
      # A lockfile change is a real change, not noise — see
      # docs/security/SUPPLY_CHAIN_SECURITY.md.
      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
          # Copyleft licences would impose obligations on a proprietary product. Flag them
          # for a human decision rather than blocking outright.
          deny-licenses: AGPL-3.0, GPL-3.0, GPL-2.0

  audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      # Advisory: a transitive vulnerability with no available fix should not block every
      # unrelated pull request. It should be visible, assessed, and recorded in
      # docs/status/RISKS.md.
      - name: Audit
        run: pnpm audit --audit-level high
        continue-on-error: true
